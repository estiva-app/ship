<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linear-lite</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #16181f;
        --panel-2: #1c1f28;
        --line: #272b36;
        --text: #e6e8ee;
        --dim: #8b91a1;
        --accent: #6c8cff;
        --neutral: #8b91a1;
        --blue: #6c8cff;
        --green: #46c08a;
        --muted: #5b6070;
        --danger: #e5697a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      a:hover { color: var(--accent); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .dim { color: var(--dim); }
      .tiny { font-size: 11px; }
      .break { word-break: break-all; }
      .clamp {
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; margin-top: 2px;
      }

      input, select, button, textarea {
        font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
      }
      input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
      .tiny-button { padding: 3px 7px; font-size: 11px; }
      textarea { resize: vertical; min-height: 52px; width: 100%; }

      header {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      header h1 { font-size: 14px; margin: 0; letter-spacing: 0.2px; }
      header .spacer { flex: 1; }
      #banner { padding: 8px 18px; font-size: 13px; display: none; }
      #banner.error { display: block; background: #3a1d24; color: #f2b8c1; }
      #banner.ok { display: block; background: #16302a; color: #9fe3c4; }

      .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 45px); }
      #sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; }
      .nav-group { margin-bottom: 18px; }
      .nav-label {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px;
        color: var(--dim); font-weight: 600; padding: 0 8px; margin-bottom: 6px;
      }
      .nav-item {
        display: flex; align-items: center; gap: 8px; justify-content: space-between;
        padding: 6px 8px; border-radius: 6px; margin-bottom: 1px;
      }
      .nav-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-item:hover { background: var(--panel-2); color: var(--text); }
      .nav-item.active { background: var(--panel-2); color: var(--accent); font-weight: 600; }
      .count { font-size: 11px; color: var(--dim); flex: none; }
      .side-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

      /* Profile menu */
      .dropdown { position: relative; }
      .dropdown-trigger { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--dim); }
      .dropdown-panel {
        position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 260px;
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      }
      .menu-label {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px;
        color: var(--dim); font-weight: 600; padding: 6px 6px 2px;
      }
      .menu-value { padding: 0 6px 6px; }
      .menu-item {
        display: block; width: 100%; text-align: left; background: none; border: none;
        padding: 7px 6px; border-radius: 6px; font-size: 13px;
      }
      .menu-item:hover { background: var(--panel); color: var(--accent); }

      /* Modal */
      .modal {
        border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
        color: var(--text); padding: 16px; width: min(520px, calc(100vw - 32px));
      }
      .modal::backdrop { background: rgba(0,0,0,0.55); }
      .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .modal-head h2 { margin: 0; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text); }
      .modal form { margin-bottom: 0; max-width: none; }

      /* Table/Board toggle */
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
      .toggle-option { padding: 4px 12px; font-size: 12px; color: var(--dim); }
      .toggle-option:hover { color: var(--text); }
      .toggle-option.active { background: var(--panel-2); color: var(--text); font-weight: 600; }

      #main { padding: 22px 26px; min-width: 0; }
      .surface { max-width: 1100px; }
      .surface-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      .surface-head .grow { flex: 1; min-width: 0; margin-bottom: 0; }
      h1 { font-size: 20px; margin: 0 0 10px; font-weight: 650; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.9px; color: var(--dim); margin: 22px 0 8px; }

      .crumbs { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); margin-bottom: 12px; }
      .crumbs .sep { opacity: 0.5; }
      .detail-main { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 26px; }
      .detail-side { border-left: 1px solid var(--line); padding-left: 18px; }
      .field { margin-bottom: 16px; }
      .field label {
        display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px;
        color: var(--dim); font-weight: 600; margin-bottom: 5px;
      }
      .field select { width: 100%; }
      .provenance { border-top: 1px solid var(--line); padding-top: 10px; margin-bottom: 14px; }
      .danger-zone { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; justify-items: start; }
      .link-button {
        background: none; border: none; padding: 0; font-size: 12px;
        color: var(--dim); text-decoration: underline; text-decoration-style: dotted;
        text-underline-offset: 2px;
      }
      .link-button:hover:not(:disabled) { color: var(--text); border-color: transparent; }
      .link-button.danger:hover:not(:disabled) { color: var(--danger); }
      .bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
      .bar-fill { height: 100%; background: var(--green); }

      form.new-issue, form.new-project { display: grid; gap: 8px; margin-bottom: 18px; max-width: 620px; }
      .row-inline { display: flex; gap: 8px; margin-top: 10px; }
      .row-inline input { flex: 1; }

      .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
      .tab {
        background: none; border: none; border-bottom: 2px solid transparent;
        padding: 7px 10px; color: var(--dim); border-radius: 0; font-size: 13px;
      }
      .tab:hover { color: var(--text); }
      .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

      .group { margin-bottom: 16px; }
      .group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .row {
        display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 9px 12px; margin-bottom: 6px;
      }
      .row .grow { flex: 1; min-width: 0; }
      .issue-title { font-weight: 550; }
      .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
      .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
      .status-neutral { color: var(--neutral); }
      .status-blue { color: var(--blue); }
      .status-green { color: var(--green); }
      .status-muted { color: var(--muted); }
      .empty { color: var(--dim); font-style: italic; padding: 6px 0; }

      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
      .card {
        display: block; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 11px 13px;
      }
      .card:hover { border-color: var(--accent); color: inherit; }
      .card h3 { margin: 0; font-size: 14px; font-weight: 600; }

      /* Wide content scrolls inside itself; the page never scrolls sideways. */
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px; color: var(--dim); }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover { background: var(--panel); }
      td:nth-child(2) { white-space: normal; min-width: 260px; }

      /* Sized so all four status columns fit beside the detail sidebar at a
         normal window width — a board whose last column is off-screen reads as
         broken. It still scrolls rather than squashing if the window is small. */
      .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(185px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
      .column { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px; min-height: 160px; }
      .column.drop-target { border-color: var(--accent); background: var(--panel-2); }
      .column-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .column-body { display: grid; gap: 6px; }
      .kanban-card {
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
        padding: 8px 10px; cursor: grab; display: grid; gap: 2px;
      }
      .kanban-card:hover { border-color: var(--accent); }
      .kanban-card.dragging { opacity: 0.4; }

      .thread { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px 12px; }
      .comment { padding: 7px 0; border-bottom: 1px solid var(--line); }
      .comment:last-of-type { border-bottom: none; }
      .comment .byline { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
      .comment-body { white-space: pre-wrap; }
      .comment-form { display: flex; gap: 8px; margin-top: 10px; }
      .comment-form input { flex: 1; }

      .feed { display: grid; gap: 9px; }
      .feed-item { border-left: 2px solid var(--line); padding-left: 10px; font-size: 13px; }
      .feed-item .when { font-size: 11px; color: var(--dim); }

      .editable { border-radius: 6px; padding: 2px 4px; margin: -2px -4px; cursor: text; }
      .editable:hover { background: var(--panel-2); }
      .editable.placeholder { color: var(--dim); font-style: italic; }
      .title-input { font-size: 20px; font-weight: 650; width: 100%; }
      .description { white-space: pre-wrap; min-height: 24px; }

      .welcome { max-width: 520px; margin-top: 40px; }

      @media (max-width: 900px) {
        .shell { grid-template-columns: 1fr; }
        #sidebar { border-right: none; border-bottom: 1px solid var(--line); }
        .detail-main { grid-template-columns: 1fr; }
        .detail-side { border-left: none; border-top: 1px solid var(--line); padding-left: 0; padding-top: 16px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Linear-lite</h1>
      <span class="spacer"></span>
      <div id="profile"></div>
    </header>
    <div id="banner"></div>
    <div class="shell">
      <nav id="sidebar"></nav>
      <main id="main"></main>
    </div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
