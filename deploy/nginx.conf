# Estiva Ship, served at the root of ship.estiva.app.
#
# TLS, compression and caching at the edge are Cloudflare's job — this server
# sees plain HTTP from `cloudflared` on the loopback and does as little as
# possible.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real client addresses do not survive the tunnel (PEEK-86), so logging them
    # records the Docker bridge gateway over and over. Keep the access log for
    # request paths; do not build anything on the address it reports.
    access_log /var/log/nginx/access.log;

    # The app is a hash-router: every route is `/#/...`, so there is no
    # deep-linked server path to fall back for. A missing file is a real 404
    # rather than a route the server should have rewritten to index.html — which
    # is the opposite of Peek, and the reason these two configs differ.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite names every asset by its content hash, so a changed file is a changed
    # URL and a stale one is never requested. That inverts the old rule: the
    # vanilla app shipped one `bundle.js` that kept its name across deploys and
    # therefore had to be `no-cache`, and the cutover (REW-8) replaced it with
    # `assets/index-<hash>.js`. Cache those hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
