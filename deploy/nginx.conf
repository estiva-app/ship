# Estiva Ship, served at the root of ship.estiva.app.
#
# TLS, compression and caching at the edge are Cloudflare's job — this server
# sees plain HTTP from `cloudflared` on the loopback and does as little as
# possible.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real client addresses do not survive the tunnel (PEEK-86), so logging them
    # records the Docker bridge gateway over and over. Keep the access log for
    # request paths; do not build anything on the address it reports.
    access_log /var/log/nginx/access.log;

    # Ship serves real paths now — `/issue/<slug>-<uuid>`, RFC 0.5 §7.2 — so a
    # deep link has to reach index.html and let the app route it.
    #
    # This was `=404`, with a comment saying a missing file is a real 404 rather
    # than a route the server should have rewritten. That was true while every
    # route lived in the fragment, and §7.6 names it as the infrastructure cost
    # of the grammar: without this line, "the link I pasted into Peek is broken
    # when someone opens it" is exactly what happens on reload.
    #
    # The cost of the fallback is that a genuinely missing path renders the app
    # instead of a 404. The app answers with its issue list, which is the same
    # thing a misspelt route has always done.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite names every asset by its content hash, so a changed file is a changed
    # URL and a stale one is never requested. That inverts the old rule: the
    # vanilla app shipped one `bundle.js` that kept its name across deploys and
    # therefore had to be `no-cache`, and the cutover (REW-8) replaced it with
    # `assets/index-<hash>.js`. Cache those hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
