# Estiva Ship, served under /ship/.
#
# TLS, compression and caching at the edge are Cloudflare's job — this server
# sees plain HTTP from `cloudflared` on the loopback and does as little as
# possible.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Real client addresses do not survive the tunnel (PEEK-86), so logging them
    # records the Docker bridge gateway over and over. Keep the access log for
    # request paths; do not build anything on the address it reports.
    access_log /var/log/nginx/access.log;

    # The app is a hash-router: every route is `/ship/#/...`, so there is no
    # deep-linked server path to fall back for. A missing file is a real 404
    # rather than a route the server should have rewritten to index.html.
    location /ship/ {
        try_files $uri $uri/ =404;
        index index.html;
    }

    # `/ship` without the trailing slash would otherwise 404 rather than reach
    # the index — nginx does not add the slash for a location that is not a
    # filesystem directory match.
    location = /ship {
        return 301 /ship/;
    }

    # The bundle is content-addressed by nothing at all: `bundle.js` keeps its
    # name across deploys. Caching it would serve stale code after a push, which
    # is precisely the failure this whole pipeline exists to avoid.
    location = /ship/bundle.js {
        add_header Cache-Control "no-cache";
    }

    location = /ship/index.html {
        add_header Cache-Control "no-cache";
    }

    # Anything outside /ship/ belongs to the relay, which sits behind a
    # different tunnel route. Answer plainly rather than leaking nginx's default
    # page if a request ever lands here by mistake.
    location / {
        return 404;
    }
}
