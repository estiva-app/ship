name: deploy

# Push to main → image on GHCR. The box pulls it within two minutes.
#
# This workflow does **not** connect to the server, and must never be given a
# key that would let it. The Hetzner firewall allows TCP 22 from one address and
# Actions runners have ephemeral ones, so an SSH deploy could not work anyway —
# but the reason to keep it out is that a deploy key in GitHub would be a
# standing credential for an access path that is deliberately closed (PEEK-54).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fast and pure, and the only thing standing between a broken push and a
      # broken shared workspace.
      - name: Test
        run: npm test

      # `npm run smoke` is not here; it has a job of its own, `smoke`, below.
      #
      # There is no Build step here any more either. It ran `node build.mjs`,
      # the vanilla app's bundler, which REW-9 deleted along with the app. The
      # only build that exists now is web/'s, and the `web` job below runs it —
      # on pull requests too, which is what this step was for. Adding a root
      # `build` that shelled into web/ would need web/'s dependencies installed
      # in this job as well, to run the same command twice.

  # The app itself. It lives in web/ with its own package.json, and the job
  # above sees none of it: the root `tsc --noEmit` reads tsconfig.json, whose
  # `include` is ["lib", "src", "scripts"] — the shared wire and fold code — and
  # the root `npm test` runs the tsx scripts that cover those.
  #
  # So this job is not a supplement; it is the only thing that compiles or tests
  # what `ship.estiva.app` serves. Without it the workflow can go green having
  # checked nothing a person can see, which is why `publish` requires it.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The root install first: web/ compiles ../lib/nostr, whose imports of
      # @noble/hashes and @noble/curves resolve out of the *root* node_modules.
      # Installing only web/ fails with seven TS2307s that look like the shared
      # library is broken.
      - name: Install the repository's dependencies
        working-directory: .
        run: npm ci

      - run: npm ci

      # `tsc -b && vite build` — the same command that builds it for real.
      # (The token lint that stood before it moved to `gate`, UIG-21.)
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # @estiva-app/ui's classes only reach the stylesheet if `content` covers
      # the package, and Tailwind does not merge `content` from a preset. When
      # it is wrong the build still succeeds and components render at the wrong
      # size, so this is the only place it can be caught.
      #
      # `../dist/ship` since the cutover (REW-8): the build writes where the
      # image looks, which is one level above web/. A path left pointing at
      # web/dist would fail loudly rather than pass vacuously — `grep -qr` on a
      # missing path exits non-zero — but it would fail for the wrong reason and
      # read as a Tailwind problem.
      - name: The shared package's classes survive Tailwind's purge
        run: |
          if ! grep -qr "max-h-72" ../dist/ship/assets/*.css; then
            echo "::error::a class used only by @estiva-app/ui is missing from the built CSS — check estivaContent is spread into tailwind.config.js"
            exit 1
          fi

  # The UI Guardrails' rules, on their own (UIG-4, as Peek's UIG-3): a raw
  # element the package already has fails here, with a message naming the
  # component. `npm run lint:rules` also writes .gates-count.json and fails on
  # an eslint-disable that switches one of these rules off. Zero errors on the
  # day this landed, so it stays zero.
  #
  # A job of its own, not a step in `web`, because GitHub can require only a
  # whole job, by its name (UIG-6): branch protection on main requires `gate`.
  # Renaming this job leaves every pull request waiting for a check that never
  # reports.
  #
  # Only web/ is installed. The root install that `web` needs is for compiling
  # ../lib/nostr; the lint reads files and compiles nothing, and passes with
  # web/ installed alone.
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Gate lint
        run: npm run lint:rules

      # The token contract: `npm run lint` is the whole lint —
      # tokens, hand-written values, the gate rules again. It moved here from
      # `web` (UIG-21) because `gate` is the one check GitHub requires, so a
      # wrong class now stops a merge, not only a deploy. Like the gate lint, it
      # reads files and compiles nothing: web/ installed alone is enough.
      - name: Lint — the token contract
        run: npm run lint

      # Every part says in one line what it is for, so `npm run ui:find` can offer
      # it before someone builds it again (UIG-13). Built from the code; nothing kept.
      - name: Every part is described
        run: npm run registry:check

  # The app driven in a real browser against the in-memory relay in
  # scripts/smoke.ts (SHI-24). It used to run only by hand, and it rotted
  # silently twice: red on main 2026-09-08 → ship#134, and again from
  # 2026-09-11 until this job landed. It stops at the first failure, so each
  # break hid the ones behind it.
  #
  # Chromium's system libraries were the reason it stayed out. `--with-deps`
  # apt-installs them, and `--only-shell` fetches the headless shell alone,
  # which is all `chromium.launch({ headless: true })` uses. The browser comes
  # from playwright-core, so the lockfile pins its version.
  #
  # Not in `publish`'s needs. It is the slowest job and the only one with a
  # browser, so a red run here should stop a merge, not a deploy that typecheck
  # and the tests have already passed. Whether a merge must wait for it is
  # branch protection's call, which requires the check by this job's name.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Both installs, for the same reason as in `web`: the smoke script builds
      # web/, which compiles ../lib/nostr out of the root node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: web

      - name: Chromium, with its system libraries
        run: npx playwright-core install --with-deps --only-shell chromium

      - name: Smoke
        run: npm run smoke

      # One PNG per surface it reached; on a failure the last one is the
      # screen it stopped on.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .smoke/
          include-hidden-files: true

  publish:
    # Both, since the cutover (REW-8). `web` used to be advisory — it could fail
    # while the image published, because the image was built from apps/ and the
    # React app was served nowhere. Now web/ *is* the image, and this repository
    # deploys itself: the box pulls `:main` from a systemd timer with nobody
    # watching, so a publish is a deploy, and an ungated `web` job is a broken
    # React build reaching production within two minutes.
    #
    # And `gate` (UIG-6): the rules stopped a deploy while they were a step in
    # `web`, and moving them into a job of their own must not change that.
    needs: [check, web, gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The relay URL is the workspace, so it is baked into the artifact
          # rather than read at runtime. Changing where this bundle points is a
          # rebuild, by design.
          build-args: |
            RELAY_URL=https://estiva.estiva.app
            ID_BASE=https://id.estiva.app
            CLIENT_ID=estiva-ship
          # `main` is what the box tracks; the sha tag is what makes a rollback
          # possible without rebuilding.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
