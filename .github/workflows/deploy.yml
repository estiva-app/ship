name: deploy

# Push to main → image on GHCR. The box pulls it within two minutes.
#
# This workflow does **not** connect to the server, and must never be given a
# key that would let it. The Hetzner firewall allows TCP 22 from one address and
# Actions runners have ephemeral ones, so an SSH deploy could not work anyway —
# but the reason to keep it out is that a deploy key in GitHub would be a
# standing credential for an access path that is deliberately closed (PEEK-54).
#
# Laid out as Peek's is (PER-16): every job installs through the shared action,
# the tests are sharded, and `publish` builds the bundle and wraps it in nginx.
# The critical path on a pull request is the slowest job, not the sum.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root: the shared wire and fold code in lib/ and src/, and the tsx
  # scripts that test it. Fast and pure, and the only thing standing between a
  # broken push and a broken shared workspace.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfiles are unchanged.
      # The action is estiva-foundation's, shared with Peek (PER-16).
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The app, compiled exactly as `publish` compiles it. The jobs above and below
  # see none of it: the root `tsc --noEmit` reads only lib, src and scripts, and
  # the tests do not build. Without this the workflow could go green having
  # compiled nothing a person can see.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both trees: web/ compiles ../lib/nostr, whose imports of @noble/hashes
      # and @noble/curves resolve out of the *root* node_modules. Installing
      # only web/ fails with seven TS2307s that look like the shared library is
      # broken.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1
        with:
          directories: |
            .
            web

      # `tsc -b && vite build`. It writes ../dist/ship, where the image looks.
      - name: Build
        run: npm --prefix web run build

      # @estiva-app/ui's classes only reach the stylesheet if `content` covers
      # the package, and Tailwind does not merge `content` from a preset. When
      # it is wrong the build still succeeds and components render at the wrong
      # size, so this is the only place it can be caught.
      - name: The shared package's classes survive Tailwind's purge
        run: |
          if ! grep -qr "max-h-72" dist/ship/assets/*.css; then
            echo "::error::a class used only by @estiva-app/ui is missing from the built CSS — check estivaContent is spread into tailwind.config.js"
            exit 1
          fi

  # web/'s Vitest suite, sharded by file as Peek's is (PER-7). A private
  # repository's runner has 2 vCPUs and Vitest leaves one for itself, so the
  # suite ran one file at a time — ~95 s, the longest step in the workflow.
  # Every shard must pass; `fail-fast` is off so a failure in one still reports
  # what the others found.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # Both trees, for the reason in `build`: the tests import ../src and
      # ../lib, which resolve out of the root node_modules.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1
        with:
          directories: |
            .
            web

      - name: Test (shard ${{ matrix.shard }} of 3)
        working-directory: web
        run: npx vitest run --shard=${{ matrix.shard }}/3

  # The UI Guardrails' rules, on their own (UIG-4, as Peek's UIG-3): a raw
  # element the package already has fails here, with a message naming the
  # component. `npm run lint:rules` also writes .gates-count.json and fails on
  # an eslint-disable that switches one of these rules off. Zero errors on the
  # day this landed, so it stays zero.
  #
  # A job of its own, because GitHub can require only a whole job, by its name
  # (UIG-6): branch protection on main requires `gate`. Renaming this job leaves
  # every pull request waiting for a check that never reports.
  #
  # Only web/ is installed: the lints read files and compile nothing.
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1
        with:
          directories: web

      - name: Gate lint
        run: npm run lint:rules

      # The token contract: `npm run lint` is the whole lint — tokens,
      # hand-written values, the gate rules again. In `gate`, the one check
      # GitHub requires, so a wrong class stops a merge, not only a deploy
      # (UIG-21).
      - name: Lint — the token contract
        run: npm run lint

      # Every part says in one line what it is for, so `npm run ui:find` can offer
      # it before someone builds it again (UIG-13). Built from the code; nothing kept.
      - name: Every part is described
        run: npm run registry:check

  # The app driven in a real browser against the in-memory relay in
  # scripts/smoke.ts (SHI-24). It used to run only by hand, and it rotted
  # silently twice: red on main 2026-09-08 → ship#134, and again from
  # 2026-09-11 until this job landed. It stops at the first failure, so each
  # break hid the ones behind it.
  #
  # `--with-deps` apt-installs Chromium's system libraries, and `--only-shell`
  # fetches the headless shell alone, which is all
  # `chromium.launch({ headless: true })` uses. The browser comes from
  # playwright-core, so the lockfile pins its version.
  #
  # Not in `publish`'s needs. It is the slowest job and the only one with a
  # browser, so a red run here should stop a merge, not a deploy that typecheck
  # and the tests have already passed. Whether a merge must wait for it is
  # branch protection's call, which requires the check by this job's name.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both trees: the smoke script builds web/.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1
        with:
          directories: |
            .
            web

      - name: Chromium, with its system libraries
        run: npx playwright-core install --with-deps --only-shell chromium

      - name: Smoke
        run: npm run smoke

      # One PNG per surface it reached; on a failure the last one is the
      # screen it stopped on.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .smoke/
          include-hidden-files: true

  publish:
    # The box pulls `:main` from a systemd timer with nobody watching, so a
    # publish is a deploy: every check that can stop a broken bundle stops this.
    # `gate` too (UIG-6): the rules stopped a deploy while they were a step, and
    # moving them into a job of their own must not change that.
    needs: [check, build, test, gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1
        with:
          directories: |
            .
            web

      # The image is an envelope for dist/ship since PER-16, as Peek's is for
      # dist/. The relay URL is the workspace, so it is baked into the bundle
      # rather than read at runtime; changing where it points is a rebuild, by
      # design. CLIENT_ID must match a `client_id` seeded in Estiva ID, or /sign
      # refuses every request as an unknown app.
      - name: Build
        run: npm --prefix web run build
        env:
          RELAY_URL: https://estiva.estiva.app
          ID_BASE: https://id.estiva.app
          CLIENT_ID: estiva-ship

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `main` is what the box tracks; the sha tag is what makes a rollback
          # possible without rebuilding.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
