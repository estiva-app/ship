name: deploy

# Push to main → image on GHCR. The box pulls it within two minutes.
#
# This workflow does **not** connect to the server, and must never be given a
# key that would let it. The Hetzner firewall allows TCP 22 from one address and
# Actions runners have ephemeral ones, so an SSH deploy could not work anyway —
# but the reason to keep it out is that a deploy key in GitHub would be a
# standing credential for an access path that is deliberately closed (PEEK-54).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fast and pure, and the only thing standing between a broken push and a
      # broken shared workspace.
      - name: Test
        run: npm test

      # `npm run smoke` is deliberately absent: it needs chromium system
      # libraries Playwright does not bundle, which is a CI rabbit hole for
      # little gain when typecheck and tests already gate the deploy.
      #
      # There is no Build step here any more either. It ran `node build.mjs`,
      # the vanilla app's bundler, which REW-9 deleted along with the app. The
      # only build that exists now is web/'s, and the `web` job below runs it —
      # on pull requests too, which is what this step was for. Adding a root
      # `build` that shelled into web/ would need web/'s dependencies installed
      # in this job as well, to run the same command twice.

  # The app itself. It lives in web/ with its own package.json, and the job
  # above sees none of it: the root `tsc --noEmit` reads tsconfig.json, whose
  # `include` is ["lib", "src", "scripts"] — the shared wire and fold code — and
  # the root `npm test` runs the tsx scripts that cover those.
  #
  # So this job is not a supplement; it is the only thing that compiles or tests
  # what `ship.estiva.app` serves. Without it the workflow can go green having
  # checked nothing a person can see, which is why `publish` requires it.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The root install first: web/ compiles ../lib/nostr, whose imports of
      # @noble/hashes and @noble/curves resolve out of the *root* node_modules.
      # Installing only web/ fails with seven TS2307s that look like the shared
      # library is broken.
      - name: Install the repository's dependencies
        working-directory: .
        run: npm ci

      - run: npm ci

      # `tsc -b && vite build` — the same command that builds it for real.
      - name: Lint — the token contract (ADOPTION S11)
        run: npm run lint
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # @estiva-app/ui's classes only reach the stylesheet if `content` covers
      # the package, and Tailwind does not merge `content` from a preset. When
      # it is wrong the build still succeeds and components render at the wrong
      # size, so this is the only place it can be caught.
      #
      # `../dist/ship` since the cutover (REW-8): the build writes where the
      # image looks, which is one level above web/. A path left pointing at
      # web/dist would fail loudly rather than pass vacuously — `grep -qr` on a
      # missing path exits non-zero — but it would fail for the wrong reason and
      # read as a Tailwind problem.
      - name: The shared package's classes survive Tailwind's purge
        run: |
          if ! grep -qr "max-h-72" ../dist/ship/assets/*.css; then
            echo "::error::a class used only by @estiva-app/ui is missing from the built CSS — check estivaContent is spread into tailwind.config.js"
            exit 1
          fi

  publish:
    # Both, since the cutover (REW-8). `web` used to be advisory — it could fail
    # while the image published, because the image was built from apps/ and the
    # React app was served nowhere. Now web/ *is* the image, and this repository
    # deploys itself: the box pulls `:main` from a systemd timer with nobody
    # watching, so a publish is a deploy, and an ungated `web` job is a broken
    # React build reaching production within two minutes.
    needs: [check, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The relay URL is the workspace, so it is baked into the artifact
          # rather than read at runtime. Changing where this bundle points is a
          # rebuild, by design.
          build-args: |
            RELAY_URL=https://estiva.estiva.app
            ID_BASE=https://id.estiva.app
            CLIENT_ID=estiva-ship
          # `main` is what the box tracks; the sha tag is what makes a rollback
          # possible without rebuilding.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
